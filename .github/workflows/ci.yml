name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PNPM_VERSION: "12.8.1"

jobs:
  api:
    name: API lint, types, tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tricolink
          POSTGRES_PASSWORD: tricolink
          POSTGRES_DB: tricolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tricolink -d tricolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://tricolink_app:tricolink_app@localhost:5432/tricolink
      MIGRATION_DATABASE_URL: postgresql+asyncpg://tricolink:tricolink@localhost:5432/tricolink
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_ORIGIN: http://localhost:3001
      API_PUBLIC_BASE_URL: http://localhost:8001
      SHORT_BASE_URL: http://localhost:3001
      JWT_SECRET: ci-jwt-secret-0000000000000000000000000000
      CSRF_SECRET: ci-csrf-secret-000000000000000000000000000
      SESSION_SECRET: ci-session-secret-000000000000000000000000
      METRICS_TOKEN: ci-metrics-token-0000000000000000000000000
      COOKIE_SECURE: "false"
      TRUSTED_PROXY_COUNT: "1"
      CLICK_RETENTION_DAYS: "365"
      CLEANUP_BATCH_SIZE: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install --with dev --no-interaction
      - name: Create runtime role
        run: PGPASSWORD=tricolink psql -h localhost -U tricolink -d tricolink -f docker/postgres/init/01-app-role.sql
      - name: Apply migrations
        working-directory: apps/api
        run: poetry run alembic upgrade head
      - name: Ruff
        working-directory: apps/api
        run: |
          poetry run ruff check src tests
          poetry run ruff format --check src tests
      - name: Mypy
        working-directory: apps/api
        run: poetry run mypy src
      - name: Pytest with coverage
        working-directory: apps/api
        run: |
          poetry run pytest -q \
            --cov=tricolink \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85
      - name: Domain coverage gate (>= 90%)
        working-directory: apps/api
        run: poetry run coverage report --include="*/domain/*" --fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  web:
    name: Web lint, types, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck and i18n
        working-directory: apps/web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm i18n:check
      - name: Unit tests
        working-directory: apps/web
        run: pnpm test
      - name: Production build
        working-directory: apps/web
        env:
          NODE_ENV: production
          API_INTERNAL_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: https://tricolink.example
        run: pnpm build
      - name: Bundle secret scan
        working-directory: apps/web
        run: pnpm scan:bundle

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Configure local environment
        run: |
          cp .env.example .env
          sed -i 's/^API_PORT=.*/API_PORT=8001/' .env
          sed -i 's/^WEB_PORT=.*/WEB_PORT=3001/' .env
          sed -i 's|^FRONTEND_ORIGIN=.*|FRONTEND_ORIGIN=http://localhost:3001|' .env
          sed -i 's|^SHORT_BASE_URL=.*|SHORT_BASE_URL=http://localhost:3001|' .env
          sed -i 's|^API_PUBLIC_BASE_URL=.*|API_PUBLIC_BASE_URL=http://localhost:8001|' .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
      - name: Start API, Postgres and Redis
        run: docker compose up -d --build --wait postgres redis api
      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  security:
    name: Secrets and dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install --with dev --no-interaction
      - name: pip-audit
        working-directory: apps/api
        run: poetry run pip-audit --desc
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm audit (production)
        working-directory: apps/web
        run: pnpm audit --prod --audit-level high

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: runtime
          push: false
          tags: tricolink-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web runner image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          target: runner
          push: false
          tags: tricolink-web:ci
          build-args: |
            API_INTERNAL_URL=https://api.example.invalid
            NEXT_PUBLIC_SITE_URL=https://tricolink.example
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
